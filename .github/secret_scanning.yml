# Exclude test fixtures from secret scanning.
# These paths contain intentionally secret-shaped values (e.g. the Google
# documentation example API key, a throwaway self-signed cert) used to test
# redaction/parsing logic. They are not real credentials.
paths-ignore:
  - "**/test/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/fixtures/**"
