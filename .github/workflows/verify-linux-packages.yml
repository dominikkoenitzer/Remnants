name: Verify Linux packages

# Temporary, branch only: builds the Linux deb and rpm the way release.yml does
# and checks their dependency fields, without creating or touching any release.
on:
  workflow_dispatch:
  push:
    branches: [fix/linux-package-deps]

permissions:
  contents: read

concurrency:
  group: verify-linux-packages
  cancel-in-progress: true

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: 1
  GIT_LFS_SKIP_SMUDGE: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  linux:
    name: Linux ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          # The dependency gate fails the build on arm64 too, so its reference
          # lists are checked here as well.
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev \
            desktop-file-utils dpkg-dev fakeroot rpm
          if [ ! -x /usr/lib/rpm/find-requires ]; then
            printf '%s\n' '#!/bin/sh' 'exec /usr/lib/rpm/rpmdeps --requires' | sudo tee /usr/lib/rpm/find-requires >/dev/null
            sudo chmod +x /usr/lib/rpm/find-requires
          fi

      - name: Install dependencies
        run: |
          node build/npm/preinstall.ts
          npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download built-in extensions
        shell: bash
        run: |
          npm run download-builtin-extensions
          for dir in .build/builtInExtensions/*/; do
            test -f "$dir/package.json" || { echo "$dir was unpacked incompletely: no package.json." >&2; exit 1; }
          done

      - name: Build app
        run: npm run gulp vscode-linux-${{ matrix.arch }}

      - name: Measure the symbol version floors
        run: |
          root="$(dirname "$GITHUB_WORKSPACE")/VSCode-linux-${{ matrix.arch }}"
          find "$root" -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.node' \
            -o -name remnants -o -name chrome-sandbox -o -name chrome_crashpad_handler \) |
            { xargs -r -n1 objdump -T 2> /dev/null || true; } > /tmp/symbols.txt
          grep -o 'GLIBC_[0-9.]*' /tmp/symbols.txt | sort -uV | tail -1 | sed 's/^/Needs at least /'
          grep -o 'GLIBCXX_[0-9.]*' /tmp/symbols.txt | sort -uV | tail -1 | sed 's/^/Needs at least /'

      - name: Build deb package
        env:
          GITHUB_TOKEN: x-access-token:${{ github.token }}
        run: |
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-deb
          npm run gulp vscode-linux-${{ matrix.arch }}-build-deb

      - name: Build rpm package
        run: |
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-rpm
          npm run gulp vscode-linux-${{ matrix.arch }}-build-rpm

      - name: Stage packages
        run: |
          mkdir -p packages
          cp .build/linux/deb/${{ matrix.deb_arch }}/deb/*.deb packages/remnants.deb
          cp .build/linux/rpm/${{ matrix.rpm_arch }}/*.rpm packages/remnants.rpm
          ls -lh packages

      - name: Print the dependency fields
        run: |
          echo "deb Depends:"
          dpkg-deb -f packages/remnants.deb Depends | tr ',' '\n' | sed 's/^ *//'
          echo
          echo "rpm Requires:"
          rpm -qp --requires packages/remnants.rpm
          echo
          echo "Floors:"
          dpkg-deb -f packages/remnants.deb Depends | tr ',' '\n' | grep -oE 'lib(c6|stdc\+\+6) \(>= [^)]*\)' | sort -uV
          rpm -qp --requires packages/remnants.rpm | grep -oE '(GLIBC|GLIBCXX)_[0-9.]+' | sort -uV | tail -n 30
          dpkg-deb -f packages/remnants.deb Depends | grep -q 'libc6 (>= 2.34)' || { echo "deb lacks libc6 (>= 2.34)" >&2; exit 1; }
          dpkg-deb -f packages/remnants.deb Depends | grep -q 'libstdc++6 (>= 12)' || { echo "deb lacks libstdc++6 (>= 12)" >&2; exit 1; }
          rpm -qp --requires packages/remnants.rpm | grep -q 'GLIBC_2.34' || { echo "rpm lacks GLIBC_2.34" >&2; exit 1; }
          rpm -qp --requires packages/remnants.rpm | grep -q 'GLIBCXX_3.4.30' || { echo "rpm lacks GLIBCXX_3.4.30" >&2; exit 1; }

      # Debian 12 (glibc 2.36, GCC 12) satisfies the floors: apt installs it and
      # the app starts, both as the CLI and as the full workbench on a display.
      - name: Install and launch the deb on Debian 12
        run: |
          docker run --rm --shm-size=1g -v "$PWD/packages:/packages:ro" debian:12 bash -c '
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update > /dev/null
            apt-get install -y /packages/remnants.deb > /dev/null
            apt-get install -y xvfb xauth procps > /dev/null
            xvfb-run -a remnants --user-data-dir=/tmp/remnants-check --version
            cat > /tmp/launch.sh <<"SCRIPT"
          set -eu
          /usr/share/remnants/remnants --no-sandbox --disable-gpu --user-data-dir=/tmp/ud --extensions-dir=/tmp/ext &
          pid=$!
          for _ in $(seq 1 30); do
            pgrep -f -- "--type=renderer" > /dev/null && break
            sleep 2
          done
          if ! pgrep -f -- "--type=renderer" > /dev/null; then
            echo "No renderer process appeared: the workbench never came up." >&2
            kill "$pid" 2> /dev/null || true
            exit 1
          fi
          echo "Renderer process up: the workbench started on Debian 12."
          kill "$pid" 2> /dev/null || true
          SCRIPT
            timeout 240 xvfb-run -a bash /tmp/launch.sh
          '

      # Debian 11 ships glibc 2.31 and GCC 10, which cannot load these binaries,
      # so apt has to refuse the deb instead of installing an app that never starts.
      - name: Refuse the deb on Debian 11
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" debian:11 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update > /dev/null
            if apt-get install -y /packages/remnants.deb > /tmp/out.txt 2>&1; then
              cat /tmp/out.txt
              echo "apt installed the deb on Debian 11, the dependency floor is too low." >&2
              exit 1
            fi
            grep -E "libc6|libstdc\+\+6" /tmp/out.txt
            echo "apt refused the deb on Debian 11, as it should."
          '

      # AlmaLinux 8 ships glibc 2.28, so dnf has to refuse the rpm as well.
      - name: Refuse the rpm on AlmaLinux 8
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" almalinux:8 bash -c '
            if dnf install -y /packages/remnants.rpm > /tmp/out.txt 2>&1; then
              cat /tmp/out.txt
              echo "dnf installed the rpm on AlmaLinux 8, the dependency floor is too low." >&2
              exit 1
            fi
            grep -E "GLIBC|GLIBCXX" /tmp/out.txt | head -n 10
            echo "dnf refused the rpm on AlmaLinux 8, as it should."
          '
