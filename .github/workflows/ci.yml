name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"

concurrency:
  group: ci-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VSCODE_SKIP_NODE_VERSION_CHECK: 1
      GIT_LFS_SKIP_SMUDGE: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Type-check (src)
        run: npm run compile-check-ts-native

      # Loads every build/gulpfile.*.ts and lists the tasks they define. Seconds
      # of work, and it catches a build script that no longer imports or parses -
      # breakage that otherwise only surfaces 20 minutes into a release build.
      - name: Load the build tasks
        run: npm run gulp -- --tasks-simple > /dev/null

      # Bundling is where a broken extension dependency shows up, and a type
      # check never gets there: an extension whose dependency stopped pulling in
      # a package it imports still type-checks fine and only fails twenty
      # minutes into a release build. The browser bundlers are left out because
      # the packaging task drives them with arguments they need.
      - name: Bundle the built-in extensions
        run: |
          status=0
          for script in extensions/*/esbuild.mts; do
            node "$script" || { echo "$script failed" >&2; status=1; }
          done
          exit $status

      # The first thing every release job does after installing, and the step
      # that breaks when a transitively hoisted build dependency changes shape.
      - name: Download built-in extensions
        run: |
          npm run download-builtin-extensions
          # The downloader exits 0 even when the unpack silently drops files, so
          # check what it actually wrote: an extension without its package.json
          # is what a broken build dependency looks like here, and it would only
          # surface as an unrelated gulp failure twenty minutes later.
          for dir in .build/builtInExtensions/*/; do
            test -f "$dir/package.json" || { echo "$dir was unpacked incompletely: no package.json." >&2; exit 1; }
          done
          ls .build/builtInExtensions
