name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  # On a timer as well as on every push. Nothing here changes between those
  # runs; what changes underneath it does. A new toolchain, a new runner
  # image, a yanked dependency. Any of those turns a green build red with no
  # commit, and without this nobody finds out until the next push.
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VSCODE_SKIP_NODE_VERSION_CHECK: 1
      GIT_LFS_SKIP_SMUDGE: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Type-check (src)
        run: npm run compile-check-ts-native

      # Loads every build/gulpfile.*.ts and lists the tasks they define. Seconds
      # of work, and it catches a build script that no longer imports or parses -
      # breakage that otherwise only surfaces 20 minutes into a release build.
      - name: Load the build tasks
        run: npm run gulp -- --tasks-simple > /dev/null

      # The same two tasks the release build runs over the extensions: bundle
      # each one and type-check it, plus the webview and notebook media. Under a
      # minute, and it is where a shifted extension dependency actually shows up
      # - type-checking src/ never touches any of it, so those breakages used to
      # surface twenty minutes into a release build instead.
      - name: Build the built-in extensions
        run: |
          npm run gulp compile-extension-media-build
          npm run gulp compile-extensions-build

      # The first thing every release job does after installing, and the step
      # that breaks when a transitively hoisted build dependency changes shape.
      - name: Download built-in extensions
        run: |
          npm run download-builtin-extensions
          # The downloader exits 0 even when the unpack silently drops files, so
          # check what it actually wrote: an extension without its package.json
          # is what a broken build dependency looks like here, and it would only
          # surface as an unrelated gulp failure twenty minutes later.
          for dir in .build/builtInExtensions/*/; do
            test -f "$dir/package.json" || { echo "$dir was unpacked incompletely: no package.json." >&2; exit 1; }
          done
          ls .build/builtInExtensions
