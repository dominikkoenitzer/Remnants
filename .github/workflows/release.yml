name: Release (Windows installer)

# Manual only. The full Electron packaging build is heavy (~1 hour), so this never
# runs on push — dispatch it from the Actions tab when you want to cut a release.
# See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.125.0). The tag will be v<version>."
        required: true

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VSCODE_SKIP_NODE_VERSION_CHECK: 1
      GIT_LFS_SKIP_SMUDGE: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Build app and installer
        run: |
          npm run gulp vscode-win32-x64
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup

      - name: Rename installer
        shell: pwsh
        run: |
          $src = ".build/win32-x64/user-setup/VSCodeSetup.exe"
          if (-not (Test-Path $src)) { throw "Installer not found at $src — packaging build did not produce it." }
          Copy-Item $src ".build/win32-x64/user-setup/RemnantsUserSetup.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemnantsUserSetup
          path: .build/win32-x64/user-setup/RemnantsUserSetup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v${{ github.event.inputs.version }}" `
            ".build/win32-x64/user-setup/RemnantsUserSetup.exe" `
            --title "Remnants v${{ github.event.inputs.version }}" `
            --notes "Windows (x64) user installer. AI-free build of Code - OSS ${{ github.event.inputs.version }}. Unsigned — on first launch click ``More info -> Run anyway`` past Windows SmartScreen." `
            --target ${{ github.sha }}
