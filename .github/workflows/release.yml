name: Release

# Manual only (a full Electron packaging build per platform takes ~15-30 min), so
# this never runs on push - dispatch it from the Actions tab when you want to cut
# a release. See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to package.json). Must match package.json; the tag will be v<version>."
        required: false
      platforms:
        description: "Which platforms to build"
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
        default: all
      draft:
        description: "Publish as a draft release"
        type: boolean
        default: false

permissions:
  contents: write # create the release and upload the assets
  id-token: write # sign the provenance attestations
  attestations: write # publish them

concurrency:
  group: release
  cancel-in-progress: false

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: 1
  GIT_LFS_SKIP_SMUDGE: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # Resolve the version once so every build job and the publish job agree on it.
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve and validate version
        id: version
        env:
          SUPPLIED: ${{ github.event.inputs.version }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          supplied=$(echo "$SUPPLIED" | tr -d '[:space:]')
          if [ -n "$supplied" ] && [ "$supplied" != "$pkg" ]; then
            echo "Dispatch version '$supplied' does not match package.json version '$pkg'." >&2
            echo "The assets and the in-app version always come from package.json, so the tag must match it." >&2
            echo "Bump package.json or leave the input blank." >&2
            exit 1
          fi
          ver="${supplied:-$pkg}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Releasing Remnants v$ver"

  windows:
    name: Windows ${{ matrix.arch }} installer
    needs: setup
    if: contains(fromJSON('["all","windows"]'), inputs.platforms || 'all')
    # Pin to windows-2022, not windows-latest: .npmrc sets build_from_source=true
    # so every native module compiles with node-gyp, and the bundled node-gyp can't
    # use the Visual Studio 18 toolchain on the newer windows-latest image
    # ("find VS unknown version"). windows-2022 ships the VS 2022 C++ tools this
    # tree expects, including the ARM64 cross compiler (see README "Build from
    # source").
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build on Node 22 (npm 10), matching the green CI job. The committed
      # package-lock.json is only in sync under npm 10's resolver; npm 11
      # (bundled with Node 24) rejects `npm ci` over the ssh2 > cpu-features
      # override ("Missing: cpu-features@ from lock file"). The
      # VSCODE_SKIP_NODE_VERSION_CHECK=1 above bypasses the .nvmrc Node 24 pin.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # npm_config_arch is what makes node-gyp compile the native modules for the
      # target architecture. The arm64 installer is cross-built on an x64 runner,
      # the same way upstream builds it.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Download built-in extensions
        shell: bash
        run: |
          npm run download-builtin-extensions
          # The downloader exits 0 even when the unpack silently drops files, so
          # check what it actually wrote: an extension without its package.json
          # is what a broken build dependency looks like here, and it would only
          # surface as an unrelated gulp failure twenty minutes later.
          for dir in .build/builtInExtensions/*/; do
            test -f "$dir/package.json" || { echo "$dir was unpacked incompletely: no package.json." >&2; exit 1; }
          done
          ls .build/builtInExtensions

      - name: Build app and installer
        run: |
          npm run gulp vscode-win32-${{ matrix.arch }}
          npm run gulp vscode-win32-${{ matrix.arch }}-inno-updater
          npm run gulp vscode-win32-${{ matrix.arch }}-user-setup

      # The packaged tree lands next to the repo. Confirm the executable really is
      # machine code for the target architecture before shipping it: a
      # misconfigured cross build quietly produces an x64 binary inside an arm64
      # installer.
      - name: Verify the build architecture
        shell: pwsh
        run: |
          $exe = Join-Path (Split-Path $env:GITHUB_WORKSPACE) "VSCode-win32-${{ matrix.arch }}/Remnants.exe"
          if (-not (Test-Path $exe)) { throw "Packaged app not found at $exe." }
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $reader = New-Object System.IO.BinaryReader($stream)
            $stream.Position = 0x3C
            $stream.Position = $reader.ReadInt32() + 4
            $machine = $reader.ReadUInt16()
          } finally { $stream.Dispose() }
          $expected = @{ 'x64' = 0x8664; 'arm64' = 0xAA64 }['${{ matrix.arch }}']
          if ($machine -ne $expected) {
            throw ("Remnants.exe reports machine 0x{0:X4}, expected 0x{1:X4}." -f $machine, $expected)
          }
          "Remnants.exe is ${{ matrix.arch }}, machine 0x{0:X4}" -f $machine

      - name: Stage installer
        shell: pwsh
        run: |
          $src = ".build/win32-${{ matrix.arch }}/user-setup/VSCodeSetup.exe"
          if (-not (Test-Path $src)) { throw "Installer not found at $src - the packaging build did not produce it." }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $src "dist/RemnantsUserSetup-${{ matrix.arch }}.exe" -Force

      # Install the x64 installer exactly as a user would and check the app
      # actually runs, before any of it is published. /MERGETASKS=!runcode keeps
      # Inno from launching the editor at the end of a silent install. The arm64
      # installer cannot execute on an x64 runner, so it only gets the header
      # check above.
      - name: Smoke-test the installer
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist/RemnantsUserSetup-x64.exe"
          Start-Process $installer -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=!runcode'
          $root = Join-Path $env:LOCALAPPDATA "Programs/Remnants"
          if (-not (Test-Path (Join-Path $root "Remnants.exe"))) { throw "Remnants.exe is missing after a silent install." }
          $cli = Join-Path $root "bin/remnants.cmd"
          if (-not (Test-Path $cli)) { throw "The remnants command is missing after a silent install." }
          # Runs the packaged Electron as plain node, so no desktop session is needed.
          $reported = (& $cli --version | Select-Object -First 1).Trim()
          if ($reported -ne "${{ needs.setup.outputs.version }}") {
            throw "Installed build reports version '$reported', expected '${{ needs.setup.outputs.version }}'."
          }
          "Installer round trip OK, version $reported"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      # The machine-wide installer and the plain archive are built after the
      # per-user installer is safely uploaded, so a failure here cannot cost the
      # release the asset that already passed its smoke test. The archive is for
      # machines where no installer may run at all: unzip it and start the exe.
      - name: Build system installer and archive
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          npm run gulp vscode-win32-${{ matrix.arch }}-system-setup
          $src = ".build/win32-${{ matrix.arch }}/system-setup/VSCodeSetup.exe"
          if (-not (Test-Path $src)) { throw "System installer not found at $src - the packaging build did not produce it." }
          New-Item -ItemType Directory -Force extra | Out-Null
          Copy-Item $src "extra/RemnantsSetup-${{ matrix.arch }}.exe" -Force
          $app = Join-Path (Split-Path $env:GITHUB_WORKSPACE) "VSCode-win32-${{ matrix.arch }}"
          # 7z rather than Compress-Archive, which takes many minutes on a tree
          # with this many files.
          7z a -tzip -mx1 "extra/Remnants-win32-${{ matrix.arch }}-$env:VERSION.zip" "$app/*" | Select-Object -Last 2

      # The archive ships without an installer, so check that an unpacked copy
      # runs as-is. 7z again, because Expand-Archive crawls on a tree this size.
      - name: Smoke-test the archive
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "archive"
          7z x -o"$tmp" "extra/Remnants-win32-x64-$env:VERSION.zip" | Select-Object -Last 2
          $cli = Join-Path $tmp "bin/remnants.cmd"
          if (-not (Test-Path $cli)) { throw "The archive has no bin/remnants.cmd." }
          $reported = (& $cli --version | Select-Object -First 1).Trim()
          if ($reported -ne $env:VERSION) { throw "The archive reports version '$reported', expected '$env:VERSION'." }
          "Archive runs unpacked, version $reported"

      - name: Upload system installer and archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}-extra
          path: extra/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} packages
    needs: setup
    if: contains(fromJSON('["all","linux"]'), inputs.platforms || 'all')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest image still supported, so the binaries link
          # against an older glibc and stay loadable on older distros. glibc is
          # backwards compatible, so this one x64 build serves Arch, Fedora and
          # current Ubuntu alike.
          - arch: x64
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Headers the native modules compile against (.npmrc sets
      # build_from_source=true), plus the tools that build the deb and the rpm.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev \
            desktop-file-utils dpkg-dev fakeroot rpm
          # The rpm dependency scanner calls this helper directly; newer rpm
          # releases ship only the rpmdeps binary that it wraps.
          if [ ! -x /usr/lib/rpm/find-requires ]; then
            printf '%s\n' '#!/bin/sh' 'exec /usr/lib/rpm/rpmdeps --requires' | sudo tee /usr/lib/rpm/find-requires >/dev/null
            sudo chmod +x /usr/lib/rpm/find-requires
          fi

      - name: Install dependencies
        run: npm ci

      - name: Download built-in extensions
        shell: bash
        run: |
          npm run download-builtin-extensions
          # The downloader exits 0 even when the unpack silently drops files, so
          # check what it actually wrote: an extension without its package.json
          # is what a broken build dependency looks like here, and it would only
          # surface as an unrelated gulp failure twenty minutes later.
          for dir in .build/builtInExtensions/*/; do
            test -f "$dir/package.json" || { echo "$dir was unpacked incompletely: no package.json." >&2; exit 1; }
          done
          ls .build/builtInExtensions

      - name: Build app
        run: npm run gulp vscode-linux-${{ matrix.arch }}

      # What the README promises about this fork, asserted against the tree that
      # is about to be packaged rather than against the source it was built from.
      - name: Verify the build identity
        run: |
          app="$(dirname "$GITHUB_WORKSPACE")/VSCode-linux-${{ matrix.arch }}/resources/app"
          node -e '
            const fs = require("fs");
            const app = process.argv[1];
            const product = JSON.parse(fs.readFileSync(app + "/product.json", "utf8"));
            const fail = (m) => { console.error("Identity check failed: " + m); process.exitCode = 1; };
            const gallery = (product.extensionsGallery || {}).serviceUrl || "";
            if (!gallery.includes("open-vsx.org")) { fail("the extension gallery is not Open VSX, it is " + gallery); }
            if (product.enableTelemetry !== false) { fail("telemetry is not disabled"); }
            if ("defaultChatAgent" in product) { fail("product.json carries a default chat agent"); }
            for (const gone of ["@github/copilot", "@github/copilot-sdk", "@vscode/copilot-api", "@anthropic-ai/sdk"]) {
              if (fs.existsSync(app + "/node_modules/" + gone)) { fail(gone + " is bundled"); }
            }
            if (!process.exitCode) { console.log("Open VSX gallery, telemetry off, no bundled AI dependencies."); }
          ' "$app"
          # The highest glibc symbol version anything in the build needs, which
          # is what decides how old a distro can be and what the README claims.
          # The executable alone is not enough: the bundled libraries and the
          # native modules are what actually set the floor.
          root=$(dirname "$(dirname "$app")")
          find "$root" -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.node'             -o -name remnants -o -name chrome-sandbox -o -name chrome_crashpad_handler \) |
            xargs -r -n1 objdump -T 2> /dev/null |
            grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 |
            sed 's/^/Needs at least /' || echo "Could not measure the glibc floor."


      - name: Stage tarball
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash build/linux/package-tarball.sh "$ARCH" "$VERSION" "$GITHUB_WORKSPACE/dist"

      # Install the tarball exactly as a user would, check the binary actually
      # runs, then uninstall it again. Catches a broken install.sh, a malformed
      # desktop entry, or an app that cannot start, before any of it is published.
      - name: Smoke-test the tarball
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tmp=$(mktemp -d)
          tar -xzf dist/Remnants-linux-"$ARCH"-*.tar.gz -C "$tmp"
          cd "$tmp/Remnants-linux-$ARCH"
          ./install.sh --user
          test -x "$HOME/.local/lib/remnants/bin/remnants"
          test -L "$HOME/.local/bin/remnants"
          desktop-file-validate "$HOME/.local/share/applications/remnants.desktop"
          desktop-file-validate "$HOME/.local/share/applications/remnants-url-handler.desktop"
          # Runs the packaged Electron as plain node, so no display is needed.
          "$HOME/.local/bin/remnants" --version
          ./uninstall.sh --user
          test ! -e "$HOME/.local/share/applications/remnants.desktop"
          test ! -e "$HOME/.local/lib/remnants"
          echo "Tarball install/uninstall round trip OK"

      # Upload the tarball before building the distro packages, so a packaging
      # failure never costs the release an artifact that already passed.
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      # The deb dependency list is computed with dpkg-shlibdeps against the
      # Chromium and VS Code sysroots, which this step downloads. The token is
      # sent as HTTP basic auth, so it needs the x-access-token username form.
      - name: Build deb package
        env:
          GITHUB_TOKEN: x-access-token:${{ github.token }}
        run: |
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-deb
          npm run gulp vscode-linux-${{ matrix.arch }}-build-deb

      - name: Build rpm package
        run: |
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-rpm
          npm run gulp vscode-linux-${{ matrix.arch }}-build-rpm

      # dpkg-deb and rpmbuild encode a build timestamp in the file name. Rename to
      # a stable name so re-running a release replaces its assets instead of
      # piling new ones up next to the old.
      - name: Stage packages
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p packages
          cp .build/linux/deb/${{ matrix.deb_arch }}/deb/*.deb "packages/remnants-$VERSION-${{ matrix.deb_arch }}.deb"
          cp .build/linux/rpm/${{ matrix.rpm_arch }}/*.rpm "packages/remnants-$VERSION-${{ matrix.rpm_arch }}.rpm"
          ls -lh packages

      # Install the deb the way a Debian or Ubuntu user would, run the installed
      # command, then remove it again. The rpm cannot be installed here, so it is
      # only inspected.
      - name: Smoke-test the packages
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          sudo apt-get install -y "./packages/remnants-$VERSION-${{ matrix.deb_arch }}.deb"
          reported=$(remnants --version | head -n1)
          test "$reported" = "$VERSION" || { echo "deb reports version '$reported', expected '$VERSION'." >&2; exit 1; }
          desktop-file-validate /usr/share/applications/remnants.desktop
          sudo apt-get remove -y remnants
          test ! -e /usr/bin/remnants
          echo "deb install/remove round trip OK"
          rpm -qip "packages/remnants-$VERSION-${{ matrix.rpm_arch }}.rpm"
          rpm -qlp "packages/remnants-$VERSION-${{ matrix.rpm_arch }}.rpm" | grep -q '^/usr/bin/remnants$'
          echo "rpm metadata OK"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}-packages
          path: packages/*
          if-no-files-found: error

      # The deb was installed on the build host itself, which is the distro it
      # was built on. Debian stable is a different one, and it is where the
      # computed dependency list has to hold up.
      - name: Smoke-test the deb on Debian
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" -e VERSION -e DEB_ARCH debian:12 bash -c '
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update > /dev/null
            apt-get install -y "/packages/remnants-$VERSION-$DEB_ARCH.deb" > /dev/null
            # The CLI wrapper refuses to start as root without one of these.
            reported=$(remnants --user-data-dir=/tmp/remnants-check --version | head -n1)
            test "$reported" = "$VERSION" || { echo "deb reports version $reported, expected $VERSION" >&2; exit 1; }
            apt-get remove -y remnants > /dev/null
            test ! -e /usr/bin/remnants
            echo "deb install/remove round trip OK on Debian 12"
          '

      # An Ubuntu runner cannot install an rpm, so the package is installed in a
      # Fedora container instead. dnf resolves the Requires list the build
      # computed, which is the part that a metadata check cannot prove.
      - name: Smoke-test the rpm on Fedora
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          docker run --rm -v "$PWD/packages:/packages:ro" -e VERSION -e RPM_ARCH fedora:latest bash -c '
            set -eu
            dnf install -y "/packages/remnants-$VERSION-$RPM_ARCH.rpm" > /dev/null
            # The CLI wrapper refuses to start as root without one of these.
            reported=$(remnants --user-data-dir=/tmp/remnants-check --version | head -n1)
            test "$reported" = "$VERSION" || { echo "rpm reports version $reported, expected $VERSION" >&2; exit 1; }
            dnf remove -y remnants > /dev/null
            test ! -e /usr/bin/remnants
            echo "rpm install/remove round trip OK on Fedora"
          '

      # Everything else runs the packaged Electron as plain node, which never
      # starts Chromium. This launches the real app on a virtual display and
      # waits for a renderer process, which only exists once the workbench
      # window is actually up. Last in the job, after every asset is uploaded,
      # so a failure here reports without costing the release anything.
      - name: Launch the app on a virtual display
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get install -y xvfb
          tmp=$(mktemp -d)
          tar -xzf dist/Remnants-linux-x64-*.tar.gz -C "$tmp"
          cat > "$tmp/launch.sh" <<'SCRIPT'
          set -eu
          app=$1
          data=$2
          "$app" --no-sandbox --disable-gpu --user-data-dir="$data/ud" --extensions-dir="$data/ext" &
          pid=$!
          for _ in $(seq 1 30); do
            pgrep -f -- '--type=renderer' > /dev/null && break
            sleep 2
          done
          if ! pgrep -f -- '--type=renderer' > /dev/null; then
            echo "No renderer process appeared: the workbench never came up." >&2
            kill "$pid" 2> /dev/null || true
            exit 1
          fi
          echo "Renderer process up: the workbench started."
          # Killing the main process takes the helpers with it. Do not pkill on
          # the data directory: this script's own argv contains that path.
          kill "$pid" 2> /dev/null || true
          SCRIPT
          timeout 240 xvfb-run -a bash "$tmp/launch.sh" "$tmp/Remnants-linux-x64/remnants" "$tmp"


  macos:
    name: macOS ${{ matrix.arch }} app
    needs: setup
    if: contains(fromJSON('["all","macos"]'), inputs.platforms || 'all')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Download built-in extensions
        shell: bash
        run: |
          npm run download-builtin-extensions
          # The downloader exits 0 even when the unpack silently drops files, so
          # check what it actually wrote: an extension without its package.json
          # is what a broken build dependency looks like here, and it would only
          # surface as an unrelated gulp failure twenty minutes later.
          for dir in .build/builtInExtensions/*/; do
            test -f "$dir/package.json" || { echo "$dir was unpacked incompletely: no package.json." >&2; exit 1; }
          done
          ls .build/builtInExtensions

      - name: Build app
        run: npm run gulp vscode-darwin-${{ matrix.arch }}

      - name: Package app bundle
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash build/darwin/package-zip.sh "$ARCH" "$VERSION" "$GITHUB_WORKSPACE/dist"

      # Unzip what is about to be published and check that macOS accepts the
      # signature and that the app runs. An ad-hoc signature that did not stick
      # makes Apple silicon refuse to launch the app at all.
      - name: Smoke-test the app bundle
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          tmp=$(mktemp -d)
          ditto -xk "dist/Remnants-darwin-$ARCH-$VERSION.zip" "$tmp"
          app="$tmp/Remnants.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          # Same invocation the bundled bin/remnants shim uses: the packaged
          # Electron as plain node, so no display is needed.
          reported=$(ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Remnants" \
            "$app/Contents/Resources/app/out/cli.js" --version | head -n1)
          test "$reported" = "$VERSION" || { echo "App reports version '$reported', expected '$VERSION'." >&2; exit 1; }
          echo "App bundle signature and launch OK, version $reported"
          # The oldest macOS the bundle declares support for, for the README.
          echo "Minimum macOS: $(defaults read "$app/Contents/Info.plist" LSMinimumSystemVersion)"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      # A disk image is what a macOS user expects to download: mount it, drag
      # the app onto the Applications shortcut, eject. The script mounts the
      # finished image back and re-verifies the bundle inside it.
      - name: Build disk image
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash build/darwin/package-dmg.sh "$ARCH" "$VERSION" "$GITHUB_WORKSPACE/extra"

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.arch }}-dmg
          path: extra/*
          if-no-files-found: error

  # The one asset its own build job cannot execute: the arm64 installer is
  # cross-built on an x64 runner. This installs it on real ARM hardware and runs
  # the editor, so nothing reaches an ARM machine untested. Deliberately not in
  # the publish job's needs - it verifies, it does not gate.
  verify-windows-arm64:
    name: Verify the Windows arm64 installer
    needs: [setup, windows]
    if: contains(fromJSON('["all","windows"]'), inputs.platforms || 'all')
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Download the installer
        uses: actions/download-artifact@v8
        with:
          name: release-windows-arm64
          path: dist

      - name: Install it and run the editor
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          $installer = Resolve-Path "dist/RemnantsUserSetup-arm64.exe"
          Start-Process $installer -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=!runcode'
          $root = Join-Path $env:LOCALAPPDATA "Programs/Remnants"
          if (-not (Test-Path (Join-Path $root "Remnants.exe"))) { throw "Remnants.exe is missing after a silent install." }
          $cli = Join-Path $root "bin/remnants.cmd"
          $reported = (& $cli --version | Select-Object -First 1).Trim()
          if ($reported -ne $env:VERSION) { throw "The arm64 build reports version '$reported', expected '$env:VERSION'." }
          "Windows arm64 installer runs on ARM hardware, version $reported"

      - name: Download the archive
        uses: actions/download-artifact@v8
        with:
          name: release-windows-arm64-extra
          path: extra

      - name: Run the archive
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "archive"
          7z x -o"$tmp" "extra/Remnants-win32-arm64-$env:VERSION.zip" | Select-Object -Last 2
          $cli = Join-Path $tmp "bin/remnants.cmd"
          if (-not (Test-Path $cli)) { throw "The archive has no bin/remnants.cmd." }
          $reported = (& $cli --version | Select-Object -First 1).Trim()
          if ($reported -ne $env:VERSION) { throw "The archive reports version '$reported', expected '$env:VERSION'." }
          "Windows arm64 archive runs unpacked on ARM hardware, version $reported"

  publish:
    name: Publish release
    needs: [setup, windows, linux, macos]
    # Publish whatever built. A platform that failed, or was not selected, must
    # not hold back the platforms that succeeded.
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: release-*
          merge-multiple: true

      - name: Collect assets
        run: |
          mkdir -p dist
          find staging -type f -exec mv -t dist {} +
          if [ -z "$(ls -A dist)" ]; then
            echo "No assets were produced - every build job failed or was skipped." >&2
            exit 1
          fi
          ls -lh dist

      # The Arch package pulls the published tarball by URL, so its checksum can
      # only be filled in once that tarball exists. Render it here, next to the
      # tarball it refers to.
      - name: Render Arch PKGBUILD
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: bash build/linux/render-pkgbuild.sh "$VERSION" dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - updating its assets."
            gh release upload "$tag" dist/* --clobber
          else
            draft_flag=""
            if [ "$DRAFT" = "true" ]; then draft_flag="--draft"; fi
            gh release create "$tag" dist/* \
              --title "Remnants v$VERSION" \
              --notes "Publishing." \
              --target "${{ github.sha }}" \
              $draft_flag
          fi

      # Notes and checksums describe the release as it now stands, not only what
      # this run rebuilt, so a single-platform re-run cannot drop the other
      # platforms from either file.
      - name: Write release notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          tag="v$VERSION"
          assets=$(mktemp)
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -v '^SHA256SUMS$' | sort > "$assets"
          cat "$assets"

          notes=$(mktemp)
          bash build/release-notes.sh "$VERSION" "$assets" > "$notes"
          cat "$notes"
          gh release edit "$tag" --notes-file "$notes"

          new=$(mktemp)
          prev=$(mktemp)
          (cd dist && sha256sum -- *) | grep -v ' SHA256SUMS$' > "$new"
          gh release download "$tag" -p SHA256SUMS -O "$prev" --clobber 2>/dev/null || : > "$prev"
          # Entries from this run win, older ones survive for assets it did not
          # rebuild, and entries for assets that are no longer on the release are
          # dropped.
          { cat "$new"; awk 'NR==FNR { seen[$2]; next } !($2 in seen)' "$new" "$prev"; } |
            awk 'NR==FNR { keep[$1]; next } ($2 in keep)' "$assets" - |
            sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" SHA256SUMS --clobber

      # None of these binaries is code-signed, so this is how a download can be
      # traced back to the workflow that produced it:
      #   gh attestation verify <file> -R dominikkoenitzer/Remnants
      # Runs last, after everything is published, so an attestation problem can
      # never hold back the release itself.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            SHA256SUMS
