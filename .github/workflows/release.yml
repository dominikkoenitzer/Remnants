name: Release (Windows installer)

# Manual only (~15-20 min full Electron packaging build), so this never runs on
# push — dispatch it from the Actions tab when you want to cut a release.
# See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to package.json). Must match package.json; the tag will be v<version>."
        required: false

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build Windows x64 installer
    # Pin to windows-2022, not windows-latest: .npmrc sets build_from_source=true
    # so every native module compiles with node-gyp, and the bundled node-gyp can't
    # use the Visual Studio 18 toolchain on the newer windows-latest image
    # ("find VS unknown version"). windows-2022 ships the VS 2022 C++ tools this
    # tree expects (see README "Prerequisites").
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VSCODE_SKIP_NODE_VERSION_CHECK: 1
      GIT_LFS_SKIP_SMUDGE: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $supplied = "${{ github.event.inputs.version }}".Trim()
          if ($supplied -and $supplied -ne $pkg) {
            throw "Dispatch version '$supplied' does not match package.json version '$pkg'. The installer and in-app version always come from package.json, so the tag must match it. Bump package.json or leave the input blank."
          }
          $ver = if ($supplied) { $supplied } else { $pkg }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing Remnants v$ver"

      # Build on Node 22 (npm 10), matching the green CI job. The committed
      # package-lock.json is only in sync under npm 10's resolver; npm 11
      # (bundled with Node 24) rejects `npm ci` over the ssh2 > cpu-features
      # override ("Missing: cpu-features@ from lock file"). The
      # VSCODE_SKIP_NODE_VERSION_CHECK=1 above bypasses the .nvmrc Node 24 pin.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Build app and installer
        run: |
          npm run gulp vscode-win32-x64
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup

      - name: Rename installer
        shell: pwsh
        run: |
          $src = ".build/win32-x64/user-setup/VSCodeSetup.exe"
          if (-not (Test-Path $src)) { throw "Installer not found at $src — packaging build did not produce it." }
          Copy-Item $src ".build/win32-x64/user-setup/RemnantsUserSetup.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemnantsUserSetup
          path: .build/win32-x64/user-setup/RemnantsUserSetup.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $tag = "v$ver"
          $asset = ".build/win32-x64/user-setup/RemnantsUserSetup.exe"
          # NOTE: the doubled backticks below are intentional PowerShell escapes —
          # in a double-quoted string ``  collapses to a single literal backtick,
          # so the notes render as `More info -> Run anyway`. Do not "simplify" them.
          $notes = "Windows (x64) user installer. AI-free build of Code - OSS $ver. Unsigned — on first launch click ``More info -> Run anyway`` past Windows SmartScreen."
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists — updating its installer asset."
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title "Remnants v$ver" --notes $notes --target ${{ github.sha }}
          }
